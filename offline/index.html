<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Roboto, sans-serif; padding: 30px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1300px; margin: 0 auto 50px auto; padding: 15px 30px; background: #1f2833; border-radius: 15px; border-bottom: 3px solid #45f3ff; }
        .logo { font-size: 1.8rem; font-weight: 800; color: #45f3ff; letter-spacing: 2px; }
        .nav-links a { color: #c5c6c7; text-decoration: none; margin-left: 20px; font-weight: 600; transition: 0.2s; }
        .nav-links a:hover { color: #45f3ff; }
        .search-container { max-width: 1300px; margin: 0 auto 30px auto; display: flex; gap: 15px; }
        .search-bar { width: 100%; padding: 15px 25px; background: #1f2833; border: 2px solid #2d3748; border-radius: 12px; color: #fff; font-size: 1.1rem; outline: none; transition: 0.2s; }
        .search-bar:focus { border-color: #45f3ff; box-shadow: 0 0 10px rgba(69, 243, 255, 0.2); }
        .container { max-width: 1300px; margin: 0 auto; }
        .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .grid-title { font-size: 2.2rem; color: #fff; font-weight: 700; letter-spacing: 1px; }
        .game-count { background: #1f2833; padding: 8px 16px; border-radius: 20px; border: 1px solid #45f3ff; color: #45f3ff; font-weight: 600; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .game-card { background: #1f2833; border-radius: 18px; overflow: hidden; display: block; text-decoration: none; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); border: 1px solid #2d3748; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .game-card:hover { transform: translateY(-8px); border-color: #45f3ff; box-shadow: 0 12px 20px rgba(69, 243, 255, 0.25); }
        .game-thumbnail { height: 160px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; color: #fff; position: relative; }
        .game-info { padding: 15px; background: #151a22; text-align: center; }
        .game-name { color: #fff; font-size: 1.1rem; font-weight: 600; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-message { grid-column: 1 / -1; text-align: center; padding: 40px; font-size: 1.2rem; color: #8f9cae; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">🎯 NO LIMIT</div>
        <div class="nav-links"><a href="#">Home</a><a href="#">Games</a><a href="#">Apps</a><a href="#">Settings</a></div>
    </nav>

    <div class="search-container">
        <input type="text" id="searchBox" class="search-bar" placeholder="🔍 Search through all games...">
    </div>

    <div class="container">
        <div class="grid-header">
            <h2 class="grid-title">All Games</h2>
            <div class="game-count" id="countLabel">Loading...</div>
        </div>
        <div class="games-grid" id="gamesGrid">
            <div class="status-message">Loading arcade library...</div>
        </div>
    </div>

    <script>
        const emojis = ["🎮", "🕹️", "⚡", "👾", "🚀", "🔥", "🏆", "🎲", "🎯", "💎", "🌟", "⚔️", "👑", "🔮", "💥"];
        const gradients = [
            "linear-gradient(135deg, #f35588, #05dfd7)", "linear-gradient(135deg, #790c8e, #b5179e)",
            "linear-gradient(135deg, #ff4b2b, #ff416c)", "linear-gradient(135deg, #11998e, #38ef7d)",
            "linear-gradient(135deg, #ff9900, #ff5500)", "linear-gradient(135deg, #00c6ff, #0072ff)",
            "linear-gradient(135deg, #7f00ff, #e100ff)", "linear-gradient(135deg, #3a1c71, #d76d77)"
        ];

        let allGames = [];

        async function loadGames() {
            const grid = document.getElementById('gamesGrid');
            const countLabel = document.getElementById('countLabel');

            try {
                // Reads the unblocked, local static file generated during build time
                const response = await fetch('games-list.json');
                const fileNames = await response.json();

                allGames = fileNames;
                countLabel.textContent = `${allGames.length} Games Available`;
                renderGames(allGames);

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="status-message" style="color: #ff4b2b;">❌ Error displaying the local game array.</div>`;
            }
        }

        function renderGames(gamesList) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            if (gamesList.length === 0) {
                grid.innerHTML = `<div class="status-message">No matching games found.</div>`;
                return;
            }

            gamesList.forEach((filename, index) => {
                let cleanName = filename.replace('.html', '').replace(/-/g, ' ').replace(/_/g, ' ');
                let grad = gradients[index % gradients.length];
                let emoji = emojis[index % emojis.length];

                const card = document.createElement('a');
                card.href = filename;
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-thumbnail" style="background: ${grad}">${emoji}</div>
                    <div class="game-info><div class="game-name">${cleanName}</div></div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allGames.filter(name => name.toLowerCase().includes(searchTerm));
            renderGames(filtered);
        });

        loadGames();
    </script>
</body>
</html>
