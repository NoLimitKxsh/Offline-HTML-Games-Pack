<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Roboto, sans-serif; padding: 30px; }
        
        /* Navbar Layout */
        .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1300px; margin: 0 auto 50px auto; padding: 15px 30px; background: #1f2833; border-radius: 15px; border-bottom: 3px solid #45f3ff; }
        .logo { font-size: 1.8rem; font-weight: 800; color: #45f3ff; letter-spacing: 2px; }
        .nav-links a { color: #c5c6c7; text-decoration: none; margin-left: 20px; font-weight: 600; transition: 0.2s; }
        .nav-links a:hover { color: #45f3ff; }

        /* Dashboard Grid Layout */
        .container { max-width: 1300px; margin: 0 auto; }
        .grid-title { font-size: 2.2rem; color: #fff; margin-bottom: 30px; font-weight: 700; letter-spacing: 1px; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        
        /* Interactive Game Cards */
        .game-card { background: #1f2833; border-radius: 18px; overflow: hidden; display: block; text-decoration: none; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); border: 1px solid #2d3748; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .game-card:hover { transform: translateY(-8px); border-color: #45f3ff; box-shadow: 0 12px 20px rgba(69, 243, 255, 0.25); }
        
        /* Visual Icon / Thumbnail Area */
        .game-thumbnail { height: 160px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #fff; position: relative; }
        .card-1 { background: linear-gradient(135deg, #f35588, #05dfd7); }
        .card-2 { background: linear-gradient(135deg, #790c8e, #b5179e); }
        .card-3 { background: linear-gradient(135deg, #ff4b2b, #ff416c); }
        .card-4 { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .card-5 { background: linear-gradient(135deg, #ff9900, #ff5500); }
        .card-6 { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .card-7 { background: linear-gradient(135deg, #7f00ff, #e100ff); }
        .card-8 { background: linear-gradient(135deg, #3a1c71, #d76d77); }
        
        /* Title Labels */
        .game-info { padding: 15px; background: #151a22; text-align: center; }
        .game-name { color: #fff; font-size: 1.1rem; font-weight: 600; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">🎯 NO LIMIT</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">Apps</a>
            <a href="#">Settings</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="grid-title">Popular Games</h2>
        <div class="games-grid">

            <!-- Card 1 -->
            <a href="1v1.lol.html" class="game-card">
                <div class="game-thumbnail card-1">🔫</div>
                <div class="game-info"><div class="game-name">1v1.lol</div></div>
            </a>

            <!-- Card 2 -->
            <a href="2048.html" class="game-card">
                <div class="game-thumbnail card-2">🔢</div>
                <div class="game-info"><div class="game-name">2048</div></div>
            </a>

            <!-- Card 3 -->
            <a href="2048cupcakes.html" class="game-card">
                <div class="game-thumbnail card-3">🧁</div>
                <div class="game-info"><div class="game-name">2048 Cupcakes</div></div>
            </a>

            <!-- Card 4 -->
            <a href="1on1soccer.html" class="game-card">
                <div class="game-thumbnail card-4">⚽</div>
                <div class="game-info"><div class="game-name">1on1 Soccer</div></div>
            </a>

            <!-- Card 5 -->
            <a href="1on1tennis.html" class="game-card">
                <div class="game-thumbnail card-5">🎾</div>
                <div class="game-info"><div class="game-name">1on1 Tennis</div></div>
            </a>

            <!-- Card 6 -->
            <a href="12minibattles.html" class="game-card">
                <div class="game-thumbnail card-6">⚔️</div>
                <div class="game-info"><div class="game-name">12 Mini Battles</div></div>
            </a>

            <!-- Card 7 -->
            <a href="8ballclassic.html" class="game-card">
                <div class="game-thumbnail card-7">🎱</div>
                <div class="game-info"><div class="game-name">8 Ball Classic</div></div>
            </a>

            <!-- Card 8 -->
            <a href="3Dflightsimulator.html" class="game-card">
                <div class="game-thumbnail card-8">✈️</div>
                <div class="game-info"><div class="game-name">Flight Simulator</div></div>
            </a>

        </div>
    </div>

</body>
</html>
