<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Dashboard</title>
    <style>
        :root {
            --accent: #45f3ff;
            --accent-rgb: 69, 243, 255;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Roboto, sans-serif; padding: 30px; transition: background 0.3s; }

        .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1300px; margin: 0 auto 50px auto; padding: 15px 30px; background: #1f2833; border-radius: 15px; border-bottom: 3px solid var(--accent); }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--accent); letter-spacing: 2px; }
        .nav-links a { color: #c5c6c7; text-decoration: none; margin-left: 20px; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }

        .search-container { max-width: 1300px; margin: 0 auto 30px auto; display: flex; gap: 15px; }
        .search-bar { width: 100%; padding: 15px 25px; background: #1f2833; border: 2px solid #2d3748; border-radius: 12px; color: #fff; font-size: 1.1rem; outline: none; transition: 0.2s; }
        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.2); }

        .container { max-width: 1300px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }

        .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .grid-title { font-size: 2.2rem; color: #fff; font-weight: 700; letter-spacing: 1px; }
        .game-count { background: #1f2833; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--accent); color: var(--accent); font-weight: 600; }

        .games-grid, .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }

        .game-card, .app-card { background: #1f2833; border-radius: 18px; overflow: hidden; display: block; text-decoration: none; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); border: 1px solid #2d3748; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; }
        .game-card:hover, .app-card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 12px 20px rgba(var(--accent-rgb), 0.25); }

        .game-thumbnail, .app-thumbnail { height: 160px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; color: #fff; position: relative; }
        .game-info, .app-info { padding: 15px; background: #151a22; text-align: center; }
        .game-name, .app-name { color: #fff; font-size: 1.1rem; font-weight: 600; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .status-message { grid-column: 1 / -1; text-align: center; padding: 40px; font-size: 1.2rem; color: #8f9cae; }

        /* Settings modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #1f2833; border: 1px solid #2d3748; border-radius: 18px; padding: 30px; width: 90%; max-width: 420px; border-top: 3px solid var(--accent); }
        .modal-box h3 { color: #fff; font-size: 1.4rem; margin-bottom: 20px; }
        .theme-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .theme-swatch { height: 60px; border-radius: 12px; cursor: pointer; border: 3px solid transparent; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.9rem; text-shadow: 0 1px 3px rgba(0,0,0,0.5); transition: 0.2s; }
        .theme-swatch:hover { transform: scale(1.05); }
        .theme-swatch.selected { border-color: #fff; }
        .modal-close { display: block; margin-top: 10px; margin-left: auto; background: var(--accent); color: #0b0c10; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar">
        <!-- Your brand new custom layout header name -->
        <div class="logo">🐐 NoLimitPxtel</div>
        <div class="nav-links">
            <a data-view="games" class="active">Home</a>
            <a data-view="games">Games</a>
            <a data-view="apps">Apps</a>
            <a id="settingsLink">Settings</a>
        </div>
    </nav>

    <div class="search-container">
        <input type="text" id="searchBox" class="search-bar" placeholder="🔍 Search through all games...">
    </div>

    <div class="container">

        <!-- GAMES VIEW -->
        <div class="view active" id="gamesView">
            <div class="grid-header">
                <h2 class="grid-title">All Games</h2>
                <div class="game-count" id="countLabel">Loading...</div>
            </div>
            <div class="games-grid" id="gamesGrid">
                <div class="status-message">Loading arcade library...</div>
            </div>
        </div>

        <!-- APPS VIEW -->
        <div class="view" id="appsView">
            <div class="grid-header">
                <h2 class="grid-title">Apps</h2>
            </div>
            <div class="apps-grid">
                <div class="app-card" id="youtubeBtn">
                    <div class="app-thumbnail" style="background: linear-gradient(135deg, #ff4b2b, #ff416c);">📺</div>
                    <div class="app-info"><div class="app-name">YouTube</div></div>
                </div>
            </div>
        </div>

    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <h3>🎨 Choose a Theme</h3>
            <div class="theme-options">
                <div class="theme-swatch" data-theme="teal" style="background:#45f3ff;">Teal</div>
                <div class="theme-swatch" data-theme="purple" style="background:#a55eea;">Purple</div>
                <div class="theme-swatch" data-theme="red" style="background:#ff4b5c;">Red</div>
                <div class="theme-swatch" data-theme="blue" style="background:#339af0;">Blue</div>
                <div class="theme-swatch" data-theme="green" style="background:#2ecc71;">Green</div>
                <div class="theme-swatch" data-theme="orange" style="background:#ff9f43;">Orange</div>
            </div>
            <button class="modal-close" id="closeSettings">Close</button>
        </div>
    </div>

    <script>
        const emojis = ["🎮", "🕹️", "⚡", "👾", "🚀", "🔥", "🏆", "🎲", "🎯", "💎", "🌟", "⚔️", "👑", "🔮", "💥"];
        const gradients = [
            "linear-gradient(135deg, #f35588, #05dfd7)", "linear-gradient(135deg, #790c8e, #b5179e)",
            "linear-gradient(135deg, #ff4b2b, #ff416c)", "linear-gradient(135deg, #11998e, #38ef7d)",
            "linear-gradient(135deg, #ff9900, #ff5500)", "linear-gradient(135deg, #00c6ff, #0072ff)",
            "linear-gradient(135deg, #7f00ff, #e100ff)", "linear-gradient(135deg, #3a1c71, #d76d77)"
        ];

        let allGames = [];

        async function loadGames() {
            const grid = document.getElementById('gamesGrid');
            const countLabel = document.getElementById('countLabel');

            try {
                const response = await fetch('games-list.json');
                const fileNames = await response.json();

                allGames = fileNames;
                countLabel.textContent = `${allGames.length} Games Available`;
                renderGames(allGames);

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="status-message" style="color: #ff4b2b;">❌ Error displaying the local game array.</div>`;
            }
        }

        function renderGames(gamesList) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            if (gamesList.length === 0) {
                grid.innerHTML = `<div class="status-message">No matching games found.</div>`;
                return;
            }

            gamesList.forEach((filename, index) => {
                let cleanName = filename.replace('.html', '').replace(/-/g, ' ').replace(/_/g, ' ');
                let grad = gradients[index % gradients.length];
                let emoji = emojis[index % emojis.length];

                const card = document.createElement('a');
                card.href = filename;
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-thumbnail" style="background: ${grad}">${emoji}</div>
                    <div class="game-info"><div class="game-name">${cleanName}</div></div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allGames.filter(name => name.toLowerCase().includes(searchTerm));
            renderGames(filtered);
        });

        // ----- View switching (Home/Games/Apps) -----
        const navLinks = document.querySelectorAll('.nav-links a[data-view]');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                const target = link.getAttribute('data-view');
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(target + 'View').classList.add('active');
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });

        // ----- YouTube app button -----
        document.getElementById('youtubeBtn').addEventListener('click', () => {
            window.open("https://www.youtube.com/watch?v=ikKIRe4qH0Y&embeds_referring_euri=https%3A%2F%2Fedpuzzle.com%2F&embeds_referring_origin=https%3A%2F%2Fedpuzzle.com&source_ve_path=NzY3NTg", "_blank");
        });

        // ----- Settings modal + theme switching -----
        const settingsModal = document.getElementById('settingsModal');
        document.getElementById('settingsLink').addEventListener('click', () => {
            settingsModal.classList.add('active');
        });
        document.getElementById('closeSettings').addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.remove('active');
        });

        const themeColors = {
            teal:   { accent: '#45f3ff', rgb: '69, 243, 255' },
            purple: { accent: '#a55eea', rgb: '165, 94, 234' },
            red:    { accent: '#ff4b5c', rgb: '255, 75, 92' },
            blue:   { accent: '#339af0', rgb: '51, 154, 240' },
            green:  { accent: '#2ecc71', rgb: '46, 204, 113' },
            orange: { accent: '#ff9f43', rgb: '255, 159, 67' },
        };

        function applyTheme(theme) {
            const t = themeColors[theme] || themeColors.teal;
            document.documentElement.style.setProperty('--accent', t.accent);
            document.documentElement.style.setProperty('--accent-rgb', t.rgb);
            document.querySelectorAll('.theme-swatch').forEach(s => {
                s.classList.toggle('selected', s.dataset.theme === theme);
            });
            localStorage.setItem('arcadeTheme', theme);
        }

        document.querySelectorAll('.theme-swatch').forEach(swatch => {
            swatch.addEventListener('click', () => applyTheme(swatch.dataset.theme));
        });

        // Load saved theme on startup
        applyTheme(localStorage.getItem('arcadeTheme') || 'teal');

        loadGames();
    </script>
</body>
</html>
